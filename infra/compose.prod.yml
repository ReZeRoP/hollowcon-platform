name: hollowcon

x-app: &app
  restart: unless-stopped
  env_file: ../.env
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hollowcon
      POSTGRES_USER: hollowcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hollowcon -d hollowcon"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: .., target: migrate }
    env_file: ../.env
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    build: { context: .., target: api }
    environment:
      API_PORT: "3000"
    volumes: [receipt_data:/var/lib/hollowcon/receipts]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    build: { context: .., target: web }
    environment:
      WEB_PORT: "3001"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  bot:
    <<: *app
    build: { context: .., target: bot }
    environment:
      BOT_HEALTH_PORT: "3002"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3002"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    build: { context: .., target: worker }
    environment:
      WORKER_HEALTH_PORT: "3003"
      # Keep real panel mutations disabled until the controlled live-panel smoke test.
      PANEL_MUTATIONS_ENABLED: "${PANEL_MUTATIONS_ENABLED:-false}"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3003"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    env_file: ../.env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      web: { condition: service_healthy }

networks:
  backend:
    internal: false

volumes:
  postgres_data:
  redis_data:
  receipt_data:
  caddy_data:
  caddy_config:
