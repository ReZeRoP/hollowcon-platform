services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hollowcon
      POSTGRES_USER: hollowcon
      POSTGRES_PASSWORD: hollowcon-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hollowcon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hollowcon -d hollowcon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hollowcon_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hollowcon_postgres:
  hollowcon_redis:
